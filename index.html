<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shift Keeper</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14161c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shift Keeper">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#14161c;--card:#1e222b;--text:#eef1f6;--sub:#9aa3b2;--ok:#3ecf8e;--warn:#f5a623;--bad:#ff5c5c;--acc:#5b8cff;--line:#2a303c}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);color:var(--text);font-family:system-ui,"Noto Sans",sans-serif;max-width:480px;margin:auto;font-size:16px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
h1{font-size:20px;margin:0}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
.notice{background:#2a2518;color:#f5d98a;border-radius:10px;padding:10px;font-size:13px;margin-bottom:12px}
.row{display:flex;gap:8px;margin-bottom:8px}
input[type=text],input[type=date],input[type=time],input[type=number]{flex:1;min-width:0;padding:12px;border-radius:10px;border:1px solid #333a47;background:#14161c;color:var(--text);font-size:16px}
button{padding:12px 14px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-size:16px}
button.sec{background:#333a47}
button.ghost{background:transparent;color:var(--sub);padding:8px 10px}
button.wide{width:100%}
.big{font-size:26px;font-weight:700}
.tk{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.tk input[type=checkbox]{width:24px;height:24px;flex:none}
.tk span{flex:1}.tk.dn span{text-decoration:line-through;color:var(--sub)}
.brow{display:flex;justify-content:space-between;align-items:baseline}
.lft{font-size:18px;font-weight:600;color:var(--ok)}
.bar{height:8px;border-radius:4px;background:#333a47;margin-top:6px;overflow:hidden}
.bar>div{height:100%;background:var(--ok)}
.hint{color:var(--sub);font-size:13px}
.day{display:flex;gap:10px;padding:8px;border-radius:10px;background:#14161c;margin-bottom:6px;border:1px solid transparent}
.day{cursor:pointer}
.rd{color:var(--bad)}
.tin{text-align:center;letter-spacing:1px}
.weekScroll{position:relative;max-height:340px;overflow-y:auto;padding-right:2px}
.day.flash{animation:fl 1.8s ease-out}
@keyframes fl{0%{background:#2c4a86}100%{background:#14161c}}
.offOn{color:var(--ok);font-weight:700}
.tree{background:transparent;border:0;padding:4px 8px;font-size:20px;opacity:.45;align-self:center;flex:none}
.tree.on{opacity:1;background:#1c3a2c}
.pen{color:var(--sub);align-self:center;flex:none}
.day.offDay{border-color:var(--ok)}
.day.tmr{border-color:var(--acc)}
.day.red{border-color:var(--bad);background:#2a1a1d}
.dd{width:66px;text-align:center;flex:none}
.ds{flex:1}
.off{color:var(--sub);font-weight:700}
.cx{text-decoration:line-through;color:var(--sub)}
.shift{padding:10px 0;border-top:1px solid var(--line)}
.shift:first-child{border-top:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.right{display:flex;align-items:center;gap:4px}
.over{color:var(--bad)}
.menu{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.menu button{background:#333a47;padding:8px 10px;font-size:14px}
.doneBtn{background:var(--ok);color:#0b1a12;font-weight:700;margin-top:4px}
.menu button.d{background:#4a2227}
summary{cursor:pointer;color:var(--sub);font-size:14px}
label{font-size:15px}
.msg{font-size:14px;color:var(--ok);min-height:20px;margin-top:8px}
.msg.err{color:var(--bad)}
.overlay{position:fixed;inset:0;background:var(--bg);overflow:auto;padding:16px;z-index:10;display:none}
.overlay.show{display:block}
.overlay .in{max-width:480px;margin:auto}
.days{display:flex;flex-wrap:wrap;gap:6px}
.days button{flex:1 0 20%;padding:10px 4px;background:#333a47}
.days button.on{background:var(--acc)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.grid button{background:#333a47;padding:14px 8px}
.grid button.on{background:var(--acc)}
.modeBtn{display:block;width:100%;text-align:left;background:#333a47;margin-bottom:10px;padding:16px}
.modeBtn.on{background:var(--acc)}
.modeBtn small{display:block;opacity:.8;margin-top:4px}
h2{font-size:16px;margin:16px 0 8px;color:var(--sub);font-weight:600}
body{padding-bottom:96px}
textarea{width:100%;min-height:200px;padding:12px;border-radius:10px;border:1px solid #333a47;background:#14161c;color:var(--text);font-size:16px;font-family:inherit;resize:vertical}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;background:transparent;color:var(--sub);border-radius:0;padding:10px 4px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabbar button.on{color:var(--acc);font-weight:700}
.tbi{font-size:20px;line-height:1}
</style>
</head>
<body>

<header>
  <h1 id="hdrTitle">Shift Keeper</h1>
  <button class="ghost" id="btnSettings" aria-label="settings">⚙</button>
</header>
<div id="tabShifts">
<div class="card">
  <div class="hint" id="weekTitle" style="margin-bottom:6px"></div>
  <div id="week"><div id="weekToday"></div><div id="weekScroll" class="weekScroll"></div></div>
</div>

<div class="card" id="counterCard">
  <label><input type="checkbox" id="vac"> <span id="vacLbl"></span></label>
  <div class="hint" id="limitText" style="margin:4px 0 10px"></div>
  <div class="hint" id="last7Lbl"></div>
  <div class="brow"><div class="big" id="past">0h</div><div class="lft" id="pastLeft"></div></div>
  <div class="bar"><div id="pastBar" style="width:0"></div></div>
  <div class="hint" id="next7Lbl" style="margin-top:10px"></div>
  <div class="brow"><div class="big" id="next">0h</div><div class="lft" id="nextLeft"></div></div>
  <div class="bar"><div id="nextBar" style="width:0"></div></div>
  <div class="hint" id="rollWarn" style="color:var(--bad);margin-top:10px"></div>
  <details style="margin-top:12px">
    <summary id="pastSum"></summary>
    <div class="row" style="margin-top:8px"><input type="date" id="pDate"><input type="number" id="pHours" step="0.5" min="0" max="24" placeholder="h"></div>
    <button id="pBtn" class="sec wide">+</button>
  </details>
</div>

<div class="card" id="addCard" style="display:none">
  <div class="row"><input type="text" id="job" list="jobs"><datalist id="jobs"></datalist></div>
  <div class="row"><input type="date" id="date"><button class="sec" id="skipDay"></button></div>
  <div class="row"><input type="text" inputmode="numeric" class="tin" maxlength="5" autocomplete="off" placeholder="18:00" id="start"><input type="text" inputmode="numeric" class="tin" maxlength="5" autocomplete="off" placeholder="18:00" id="end"></div>
  <button class="ghost" id="secondBtn" style="padding-left:0"></button>
  <div id="secondBox" style="display:none">
    <div class="row"><input type="text" id="job2" list="jobs"></div>
    <div class="row"><input type="text" inputmode="numeric" class="tin" maxlength="5" autocomplete="off" placeholder="18:00" id="start2"><input type="text" inputmode="numeric" class="tin" maxlength="5" autocomplete="off" placeholder="18:00" id="end2"></div>
  </div>
  <div class="row" style="margin-bottom:0">
    <button id="addBtn" style="flex:1"></button>
    <button id="cancelEdit" class="sec" style="display:none">✕</button>
  </div>
  <div class="msg" id="msg"></div>
</div>

</div>
<div id="tabLog" style="display:none">
<h2 id="logTitle" style="margin:16px 0 8px"></h2>
<div class="card" id="list"></div>
</div>
<div id="tabSpecial" style="display:none">
  <h2 id="apHead"></h2>
  <div class="card">
    <div class="row"><input type="text" id="apName" autocomplete="off"></div>
    <div class="row"><input type="date" id="apDate"><input type="text" inputmode="numeric" class="tin" maxlength="5" autocomplete="off" placeholder="18:00" id="apTime"></div>
    <div class="row"><input type="text" id="apNote" autocomplete="off"></div>
    <div class="row" style="margin-bottom:0"><button id="apAddBtn" style="flex:1"></button><button id="apCancel" class="sec" style="display:none">✕</button></div>
    <div class="msg" id="apMsg"></div>
  </div>
  <div class="card" id="apList"></div>
  <h2 id="npHead"></h2>
  <div class="card"><textarea id="notepad"></textarea></div>
</div>
<div id="tabTasks" style="display:none">
  <h2 id="tkHead"></h2>
  <div class="card">
    <div class="row"><input type="text" id="tkIn" autocomplete="off"><button id="tkAdd">+</button></div>
    <div id="tkList"></div>
    <button class="sec wide" id="tkReset" style="margin-top:10px"></button>
  </div>
</div>
<nav class="tabbar">
  <button data-tab="shifts" class="on"><span class="tbi">📅</span><span id="tabLblShifts"></span></button>
  <button data-tab="log"><span class="tbi">📋</span><span id="tabLblLog"></span></button>
  <button data-tab="tasks"><span class="tbi">✅</span><span id="tabLblTasks"></span></button>
  <button data-tab="special"><span class="tbi">★</span><span id="tabLblSpecial"></span></button>
</nav>

<div class="overlay" id="daySheet"><div class="in" id="dayIn"></div></div>
<div class="overlay" id="settings"><div class="in" id="settingsIn"></div></div>
<div class="overlay" id="setup"><div class="in" id="setupIn"></div></div>

var SKEY="shiftkeeper_v4";
var S=loadState();
var editId=null,openMenu=null,secondOpen=false,curTab="shifts",apEditId=null;

function loadState(){
  var d=null;
  try{d=JSON.parse(localStorage.getItem(SKEY))}catch(e){}
  if(!d){
    d={lang:null,mode:null,vac:false,job1:"",job2:"",shifts:[],off:[],appts:[],notes:"",tasks:[],weekStart:1};
    try{var old=JSON.parse(localStorage.getItem("shifts_v2"));if(old&&old.length){d.shifts=old;d.mode="student"}}catch(e){}
    try{if(localStorage.getItem("vac_v1")==="1")d.vac=true}catch(e){}
  }
  if(!d.shifts)d.shifts=[];
  if(!d.off)d.off=[];
  if(!d.appts)d.appts=[];
  if(!d.tasks)d.tasks=[];
  if(d.notes==null)d.notes="";
  if(d.weekStart==null)d.weekStart=1;
  return d;
}
function save(){try{localStorage.setItem(SKEY,JSON.stringify(S))}catch(e){}}

function $(id){return document.getElementById(id)}
function t(k){var L=T[S.lang]||T.en;return L[k]!=null?L[k]:T.en[k]}
function esc(x){return String(x).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function pad(n){return String(n).padStart(2,"0")}
function isStudent(){return S.mode==="student"}
function limit(){return S.vac?40:28}
function loc(){for(var i=0;i<LANGS.length;i++)if(LANGS[i][0]===S.lang)return LANGS[i][2];return "en"}

function parseT(x){var p=x.split(":").map(Number);return p[0]*60+p[1]}
function span(a,b){var m=parseT(b)-parseT(a);if(m<=0)m+=1440;return m/60}
function hours(s){

var HCACHE={};
function nthMon(y,m,n){var first=new Date(Date.UTC(y,m-1,1)).getUTCDay();return 1+((8-first)%7)+(n-1)*7}
function jpHolidays(y){
  if(HCACHE[y])return HCACHE[y];
  var set={};
  function add(m,d){set[Date.UTC(y,m-1,d)/86400000]=1}
  add(1,1);add(1,nthMon(y,1,2));add(2,11);
  if(y>=2020)add(2,23);
  add(3,Math.floor(20.8431+0.242194*(y-1980)-Math.floor((y-1980)/4)));
  add(4,29);add(5,3);add(5,4);add(5,5);
  add(7,nthMon(y,7,3));
  if(y>=2016)add(8,11);
  add(9,nthMon(y,9,3));
  add(9,Math.floor(23.2488+0.242194*(y-1980)-Math.floor((y-1980)/4)));
  add(10,nthMon(y,10,2));
  add(11,3);add(11,23);
  var days=Object.keys(set).map(Number).sort(function(a,b){return a-b});
  days.forEach(function(d){
    if(new Date(d*86400000).getUTCDay()===0){var n=d+1;while(set[n])n++;set[n]=1}
  });
  Object.keys(set).map(Number).forEach(function(d){
    var m=d+1;
    if(set[m+1]&&!set[m]&&new Date(m*86400000).getUTCDay()!==0)set[m]=1;
  });
  HCACHE[y]=set;return set;
}

}

function toAscii(s){return String(s==null?"":s).replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-65248)}).replace(/[：]/g,":")}
function normTime(s){
  s=toAscii(s).trim();var hh,mm,mt=s.match(/^(\d{1,2})[:.](\d{1,2})$/);
  if(mt){hh=+mt[1];mm=+mt[2]}
  else{
    var d=s.replace(/\D/g,"");
    if(!d||d.length>4)return "";
    if(d.length<=2){hh=+d;mm=0}
    else if(d.length===3){hh=+d.slice(0,1);mm=+d.slice(1)}
    else{hh=+d.slice(0,2);mm=+d.slice(2)}
  }
  if(hh===24&&mm===0)hh=0;
  if(hh>23||mm>59)return "";
  return pad(hh)+":"+pad(mm);
}

    $("job").value=s.job;$("date").value=s.date;$("start").value=s.start;$("end").value=s.end;
    $("cancelEdit").style.display="";
    render();window.scrollTo(0,0);return;
  }
  else if(act==="actual"){
    var cur=s.aStart?s.aStart+"-"+s.aEnd:s.start+"-"+s.end;
    var v=prompt(t("actualPrompt"),cur);
    if(v===null)return;
    v=v.trim();
    if(v===""){delete s.aStart;delete s.aEnd}
    else{
      var m=v.match(/^(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})$/);
      if(!m){alert(t("actualPrompt"));return}
      s.aStart=pad(Number(m[1]))+":"+m[2];s.aEnd=pad(Number(m[3]))+":"+m[4];
    }
  }
  save();render();
};

var dayEdit=null;
function findShift(id){return S.shifts.filter(function(x){return String(x.id)===String(id)})[0]}
function renderDay(){
  var ov=$("daySheet");
  if(!dayEdit){ov.className="overlay";return}
  var list=S.shifts.filter(function(s){return s.date===dayEdit}).sort(sortShifts);
  var html='<h1 style="margin-bottom:12px"'+(isRedDay(dayNum(dayEdit))?' class="rd"':"")+">"+esc(dlabel(dayEdit))+(isHoliday(dayNum(dayEdit))?" 🎌":"")+"</h1>";
  if(!hasWork(dayEdit))html+='<button class="'+(isOff(dayEdit)?"":"sec ")+'wide" data-dact="off" style="margin-bottom:12px">'+(isOff(dayEdit)?"✓ ":"")+"🌴 "+esc(t("dayoff"))+"</button>";
  list.forEach(function(s){
    var past=s.fixed!=null;
    html+='<div class="card"'+(s.cancelled?' style="opacity:.6"':"")+">";
    if(past){
      html+='<div class="row"><b style="flex:1;align-self:center">'+esc(t("pastHours"))+'</b><input type="number" step="0.5" min="0" max="24" value="'+s.fixed+'" data-f="fixed" data-id="'+s.id+'"></div>';
    }else{
      html+='<div class="row"><input type="text" value="'+esc(s.job||"")+'" placeholder="'+esc(jobName(s))+'" data-f="job" data-id="'+s.id+'"></div>'
        +'<div class="row"><input '+TIN_JS+' value="'+s.start+'" data-f="start" data-id="'+s.id+'"><input '+TIN_JS+' value="'+s.end+'" data-f="end" data-id="'+s.id+'"></div>';
    }
    html+='<div class="menu" style="margin-top:0">';
    if(!past){
      html+='<button data-dact="cancel" data-id="'+s.id+'">'+(s.cancelled?"↩":"⊘")+" "+esc(t("cancelShift"))+"</button>";
      if(!s.cancelled)html+='<button data-dact="ics" data-id="'+s.id+'">📅 '+esc(t("cal"))+"</button>";
    }
    html+='<button class="d" data-dact="del" data-id="'+s.id+'">✕ '+esc(t("del"))+"</button>";
    if(isStudent())html+='<span class="hint" style="align-self:center">'+fmt(hours(s))+"</span>";
    html+="</div></div>";
  });
  html+='<div class="card"><b>+ '+esc(t("add"))+'</b><div class="row" style="margin-top:8px"><input type="text" id="dJob" value="'+esc(S.job1||"")+'" placeholder="'+esc(t("job"))+'"></div>'
    +'<div class="row"><input '+TIN_JS+' id="dStart" value="00:00"><input '+TIN_JS+' id="dEnd" value="00:00"></div>'
    +'<button class="sec wide" id="dAddBtn" data-dact="add">'+esc(t("add"))+"</button></div>"
    +'<button class="wide doneBtn" data-dact="close">✓ '+esc(t("done"))+"</button>";
  $("dayIn").innerHTML=html;
  ov.className="overlay show";
}
$("week").addEventListener("click",function(e){
  var tr=e.target.closest?e.target.closest("[data-tree]"):null;
  if(tr){var td=tr.getAttribute("data-tree");setOff(td,!isOff(td));save();render();return}
  var el=e.target.closest?e.target.closest("[data-day]"):null;
  if(!el)return;
  dayEdit=el.getAttribute("data-day");renderDay();
});
function updateDayAdd(){
  var s=$("dStart"),e=$("dEnd"),b=$("dAddBtn");
  if(!s||!e||!b)return;
  var sv=normTime(s.value),ev=normTime(e.value),ok=sv&&ev&&sv!==ev;
  b.className=(ok?"":"sec ")+"wide";
}
$("dayIn").addEventListener("input",function(e){if(e.target.id==="dStart"||e.target.id==="dEnd")updateDayAdd()});
$("dayIn").addEventListener("change",function(e){
  if(e.target.id==="dStart"||e.target.id==="dEnd"){updateDayAdd();return}
  var f=e.target.getAttribute("data-f");if(!f)return;
  var s=findShift(e.target.getAttribute("data-id"));if(!s)return;
  if(f==="job"){s.job=e.target.value.trim()}
  else if(f==="fixed"){
    var hv=parseFloat(e.target.value);
    if(isNaN(hv)||hv<0||hv>24){renderDay();return}
    s.fixed=hv;
  }else{return}
  save();render();
});
$("dayIn").addEventListener("focusout",function(e){
  var el=e.target,f=el.getAttribute&&el.getAttribute("data-f");
  if(f!=="start"&&f!=="end")return;
  var s=findShift(el.getAttribute("data-id"));if(!s)return;
  var raw=el.value.trim();
  if(raw===""){el.value=s[f];return}
  var v=normTime(raw),other=f==="start"?s.end:s.start;
  if(!v||v===other){alert(t("fill"));renderDay();return}
  if(v===s[f]){el.value=v;return}
  s[f]=v;delete s.aStart;delete s.aEnd;s.notified=false;el.value=v;
  save();render();
});
$("dayIn").addEventListener("click",function(e){
  var a=e.target.getAttribute("data-dact");if(!a)return;
  if(a==="close"){dayEdit=null;renderDay();return}
  if(a==="off"){setOff(dayEdit,!isOff(dayEdit));save();render();renderDay();return}
  if(a==="add"){
    var j=$("dJob").value.trim(),st=tval("dStart"),en=tval("dEnd");
    if(!st||!en||st===en){alert(t("fill"));return}
    S.shifts.push({id:Date.now(),job:j,slot:1,date:dayEdit,start:st,end:en});
    setOff(dayEdit,false);
    flashDates=[dayEdit];save();render();flashDates=[];renderDay();return;
  }
  var s=findShift(e.target.getAttribute("data-id"));if(!s)return;
  if(a==="ics"){downloadIcs(s);return}
  if(a==="cancel")s.cancelled=!s.cancelled;
  if(a==="del")S.shifts=S.shifts.filter(function(x){return x!==s});
  save();render();renderDay();
});

function showTab(n){
  curTab=n;
  $("tabShifts").style.display=n==="shifts"?"":"none";
  $("tabLog").style.display=n==="log"?"":"none";
  $("tabSpecial").style.display=n==="special"?"":"none";
  $("tabTasks").style.display=n==="tasks"?"":"none";
  var bs=document.querySelectorAll(".tabbar button");
  for(var i=0;i<bs.length;i++)bs[i].className=bs[i].getAttribute("data-tab")===n?"on":"";
  window.scrollTo(0,0);
}
document.querySelector(".tabbar").addEventListener("click",function(e){
  var b=e.target.closest?e.target.closest("[data-tab]"):null;
  if(b)showTab(b.getAttribute("data-tab"));
});

function findAp(id){return S.appts.filter(function(x){return String(x.id)===String(id)})[0]}
function renderAppts(){
  var today=todayStr(),up=[],past=[];
  S.appts.slice().sort(function(a,b){return (a.date+(a.time||"")).localeCompare(b.date+(b.time||""))}).forEach(function(a){(a.date>=today?up:past).push(a)});
  past.reverse();
  function row(a,old){
    return '<div class="shift"><div class="top"><div class="'+(old?"cx":"")+'"><b>📌 '+esc(a.title)+'</b><br><small class="hint">'+esc(dlabel(a.date))+(a.time?" · "+esc(a.time):"")+(a.note?" · "+esc(a.note):"")+"</small></div>"
      +'<div class="right"><button class="ghost" data-ap="edit" data-id="'+a.id+'">✎</button><button class="ghost" data-ap="ics" data-id="'+a.id+'">📅</button><button class="ghost" data-ap="del" data-id="'+a.id+'">✕</button></div></div></div>';
  }
  var html="";
  up.forEach(function(a){html+=row(a,false)});
  past.forEach(function(a){html+=row(a,true)});
  $("apList").innerHTML=html||'<div class="hint">'+esc(t("apEmpty"))+"</div>";
}
function apMsg(text,err){var m=$("apMsg");m.textContent=text||"";m.className="msg"+(err?" err":"")}
function apReset(){
  apEditId=null;
  $("apName").value="";$("apNote").value="";$("apTime").value="";$("apDate").value=todayStr();
  $("apCancel").style.display="none";
}
$("apAddBtn").onclick=function(){
  var title=$("apName").value.trim(),date=$("apDate").value,tm=normTime($("apTime").value),note=$("apNote").value.trim();
  if(!title||!date){apMsg(t("apFill"),true);return}
  if(apEditId!==null){
    var a=findAp(apEditId);
    if(a){a.title=title;a.date=date;a.time=tm;a.note=note;a.notified=false}
  }else{
    S.appts.push({id:Date.now(),title:title,date:date,time:tm,note:note});
  }
  apReset();save();render();
  apMsg("✓ "+t("added")+" · "+dlabel(date));
};
$("apCancel").onclick=function(){apReset();apMsg("");render()};
$("apList").onclick=function(e){
  var act=e.target.getAttribute("data-ap");if(!act)return;
  var a=findAp(e.target.getAttribute("data-id"));if(!a)return;
  if(act==="del"){S.appts=S.appts.filter(function(x){return x!==a});if(apEditId===a.id)apReset()}
  else if(act==="ics"){downloadApIcs(a);return}
  else if(act==="edit"){
    apEditId=a.id;
    $("apName").value=a.title;$("apDate").value=a.date;$("apTime").value=a.time||"";$("apNote").value=a.note||"";
    $("apCancel").style.display="";
    apMsg("");render();window.scrollTo(0,0);return;
  }
  save();render();
};
function downloadApIcs(a){
  var nm=String(a.title).replace(/[,;\\\r\n]/g," "),nt=String(a.note||"").replace(/[,;\\\r\n]/g," ");
  var txt="BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//ShiftKeeper//EN\r\nBEGIN:VEVENT\r\nUID:ap"+a.id+"@shiftkeeper\r\nDTSTAMP:"+icsTime(todayStr(),"00:00",false);
  if(a.time){
    var m=parseT(a.time)+60;
    txt+="\r\nDTSTART:"+icsTime(a.date,a.time,false)+"\r\nDTEND:"+icsTime(a.date,pad(Math.floor(m/60)%24)+":"+pad(m%60),m>=1440)
      +"\r\nSUMMARY:"+nm+(nt?"\r\nDESCRIPTION:"+nt:"")+"\r\nBEGIN:VALARM\r\nTRIGGER:-PT30M\r\nACTION:DISPLAY\r\nDESCRIPTION:"+nm+" - 30 min\r\nEND:VALARM";
  }else{
    txt+="\r\nDTSTART;VALUE=DATE:"+a.date.replace(/-/g,"")+"\r\nDTEND;VALUE=DATE:"+nextDate(a.date).replace(/-/g,"")
      +"\r\nSUMMARY:"+nm+(nt?"\r\nDESCRIPTION:"+nt:"")+"\r\nBEGIN:VALARM\r\nTRIGGER:PT9H\r\nACTION:DISPLAY\r\nDESCRIPTION:"+nm+"\r\nEND:VALARM";
  }
  txt+="\r\nEND:VEVENT\r\nEND:VCALENDAR";
  var el=document.createElement("a");
  el.href=URL.createObjectURL(new Blob([txt],{type:"text/calendar"}));
  el.download="appointment.ics";el.click();
}

var noteTimer=null;
$("notepad").addEventListener("input",function(){
  S.notes=this.value;
  clearTimeout(noteTimer);noteTimer=setTimeout(save,400);
});
$("notepad").addEventListener("blur",function(){S.notes=this.value;save()});

function renderTasks(){
  var html="";
  S.tasks.forEach(function(k){
    html+='<div class="tk'+(k.done?" dn":"")+'"><input type="checkbox" data-tk="chk" data-id="'+k.id+'"'+(k.done?" checked":"")+'><span>'+esc(k.text)+'</span><button class="ghost" data-tk="del" data-id="'+k.id+'">✕</button></div>';
  });
  $("tkList").innerHTML=html||'<div class="hint" style="padding:10px 0">'+esc(t("tkEmpty"))+"</div>";
  $("tkReset").style.display=S.tasks.some(function(k){return k.done})?"":"none";
}
function addTask(){
  var v=$("tkIn").value.trim();if(!v)return;
  S.tasks.push({id:Date.now(),text:v,done:false});
  $("tkIn").value="";save();renderTasks();
}
$("tkAdd").onclick=addTask;
$("tkIn").addEventListener("keydown",function(e){if(e.key==="Enter")addTask()});
$("tkReset").onclick=function(){S.tasks.forEach(function(k){k.done=false});save();renderTasks()};
$("tkList").addEventListener("click",function(e){
  var a=e.target.getAttribute("data-tk");if(!a)return;
  var id=e.target.getAttribute("data-id");
  if(a==="del")S.tasks=S.tasks.filter(function(k){return String(k.id)!==id});
  else S.tasks.forEach(function(k){if(String(k.id)===id)k.done=e.target.checked});
  save();renderTasks();
});

function updateHolidays(){
  try{
    if(!navigator.onLine||!window.fetch)return;
    if(S.holAt&&Date.now()-S.holAt<7*86400000)return;
    fetch("https://holidays-jp.github.io/api/v1/date.json").then(function(r){return r.json()}).then(function(j){
      var by={},hol={};
      Object.keys(j).forEach(function(d){if(/^\d{4}-\d{2}-\d{2}$/.test(d)){hol[d]=1;var y=d.slice(0,4);by[y]=(by[y]||0)+1}});
      var ys=[];
      Object.keys(by).forEach(function(y){if(by[y]>=10&&by[y]<=25)ys.push(Number(y))});
      if(!ys.length)return;
      S.hol=hol;S.holYears=ys;S.holAt=Date.now();save();render();
    }).catch(function(){});
  }catch(x){}
}
window.addEventListener("online",updateHolidays);

function checkReminders(){
  if(!("Notification" in window)||Notification.permission!=="granted")return;
  var now=Date.now();
  S.shifts.forEach(function(s){
    if(s.cancelled||s.fixed!=null||!s.start)return;
    var diff=new Date(s.date+"T"+s.start+":00").getTime()-now;
    if(diff>0&&diff<=30*60000&&!s.notified){
      s.notified=true;save();
      try{new Notification(jobName(s)+" · "+Math.ceil(diff/60000)+" min",{body:s.start+"-"+s.end})}catch(e){}
    }
  });
  S.appts.forEach(function(a){
    if(!a.time||a.notified)return;
    var diff=new Date(a.date+"T"+a.time+":00").getTime()-now;
    if(diff>0&&diff<=30*60000){
      a.notified=true;save();
      try{new Notification("📌 "+a.title+" · "+Math.ceil(diff/60000)+" min",{body:a.time+(a.note?" · "+a.note:"")})}catch(e){}
    }
  });
}
setInterval(checkReminders,30000);

$("date").value=todayStr();
$("pDate").value=todayStr();
$("job").value=S.job1||"";
$("apDate").value=todayStr();
$("notepad").value=S.notes||"";
clearTimes();
render();
updateHolidays();
if("serviceWorker" in navigator&&/^https?:/.test(location.protocol)){navigator.serviceWorker.register("sw.js").catch(function(){})}
</script>
</body>
</html>
